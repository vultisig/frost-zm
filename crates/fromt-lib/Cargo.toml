[package]
name = "fromt-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "fromtlib"
crate-type = ["cdylib", "rlib"]

[dependencies]
frost-ffi = { path = "../frost-ffi" }
frost-ceremony = { path = "../frost-ceremony" }
frost-session = { path = "../frost-session" }
frost-core = { version = "2", features = ["internals"] }
frost-ed25519 = "2"
curve25519-dalek = { version = "4", features = ["serde"] }
rand = "0.8"
thiserror = "1"
lazy_static = "1.4"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
tiny-keccak = { version = "2", features = ["keccak"] }

# Monero transaction construction + threshold CLSAG
monero-wallet = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false, features = ["std", "multisig", "compile-time-generators"] }
monero-oxide = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false, features = ["std", "compile-time-generators"] }
monero-clsag = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false, features = ["std", "multisig", "compile-time-generators"] }
monero-address = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false, features = ["std"] }
monero-interface = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false, features = ["std"] }
monero-simple-request-rpc = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false, optional = true }
dalek-ff-group = { version = "0.5", default-features = false }
modular-frost = { version = "0.11", default-features = false, features = ["ed25519"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde_json = "1"
flexible-transcript = { version = "0.3", features = ["recommended"] }

[features]
default = []
rpc = ["dep:monero-simple-request-rpc", "dep:tokio", "dep:reqwest"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
