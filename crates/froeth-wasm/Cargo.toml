[package]
name = "froeth-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
frost-core = { version = "2.2", features = ["internals", "serialization"] }
frost-secp256k1 = "=2.2.0"
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
hex = "0.4"
froeth-lib = { path = "../froeth-lib", default-features = false, features = [] }
frost-session = { path = "../frost-session" }
frost-ceremony = { path = "../frost-ceremony" }
tiny-keccak = { version = "2", features = ["keccak"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
