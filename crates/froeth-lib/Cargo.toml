[package]
name = "froeth-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "froethlib"
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
native = ["bitcoin"]

[dependencies]
frost-ffi = { path = "../frost-ffi" }
frost-ceremony = { path = "../frost-ceremony" }
frost-session = { path = "../frost-session" }
frost-core = { version = "2", features = ["internals"] }
frost-secp256k1 = "=2.2.0"
bitcoin = { version = "0.32", optional = true }
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
rand = "0.8"
lazy_static = "1.4"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
tiny-keccak = { version = "2", features = ["keccak"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
