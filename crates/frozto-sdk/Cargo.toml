[package]
name = "frozto-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "froztosdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
frozto-lib = { path = "../frozto-lib", default-features = false }
frost-ffi = { path = "../frost-ffi" }

orchard = "0.12"
zcash_client_backend = { git = "https://github.com/ChainSafe/librustzcash-nu61", branch = "feat/snap-nu61", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard"] }
zcash_client_memory = { git = "https://github.com/ChainSafe/librustzcash-nu61", branch = "feat/snap-nu61", features = ["orchard", "transparent-inputs"] }
zcash_keys = { git = "https://github.com/ChainSafe/librustzcash-nu61", branch = "feat/snap-nu61", features = ["transparent-inputs", "orchard", "sapling", "unstable", "test-dependencies"] }
zcash_protocol = { git = "https://github.com/ChainSafe/librustzcash-nu61", branch = "feat/snap-nu61" }

tonic = { version = "0.14", features = ["channel", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
