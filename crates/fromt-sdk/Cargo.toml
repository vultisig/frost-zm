[package]
name = "fromt-sdk"
version = "0.1.0"
edition = "2021"

[lib]
name = "fromtsdk"
crate-type = ["cdylib", "rlib"]

[dependencies]
fromtlib = { path = "../fromt", features = ["rpc"], package = "fromt" }
frost-ffi = { path = "../frost-ffi" }

monero-simple-request-rpc = { git = "https://github.com/monero-oxide/monero-oxide", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
