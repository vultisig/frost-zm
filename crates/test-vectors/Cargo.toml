[package]
name = "test-vectors"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "generate-vectors"
path = "src/main.rs"

[dependencies]
frozt-lib = { path = "../frozt-lib" }
fromt-lib = { path = "../fromt-lib" }
frobt-lib = { path = "../frobt-lib" }
froeth-lib = { path = "../froeth-lib" }
frost-ceremony = { path = "../frost-ceremony" }
frost-ffi = { path = "../frost-ffi" }
frost-core = { version = "2.2", features = ["internals"] }
frost-rerandomized = "2.2"
frost-ed25519 = "2"
frost-secp256k1 = "=2.2.0"
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "475a552", features = ["frost"] }
curve25519-dalek = { version = "4", features = ["serde"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
group = "0.13"
jubjub = "0.10"
sapling-crypto = { version = "0.6", default-features = false }
bech32 = "0.11"
