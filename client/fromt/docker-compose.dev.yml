services:
  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-fromt-redis-secret}
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-fromt-redis-secret}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  relay:
    build:
      context: ../../..
      dockerfile: frosty-lib/client/fromt/Dockerfile.relay
    ports:
      - "9091:9090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/ping || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  vultiserver-api:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: frosty-lib/client/fromt/Dockerfile.vultiserver
    command: ["vultisigner"]
    ports:
      - "8081:8080"
    volumes:
      - vultiserver-data:/data/vaults
      - ./vultiserver-config.json:/build/vultiserver/config.json:ro
    working_dir: /build/vultiserver
    depends_on:
      redis:
        condition: service_healthy
      relay:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ping || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  vultiserver-worker:
    platform: linux/amd64
    build:
      context: ../../..
      dockerfile: frosty-lib/client/fromt/Dockerfile.vultiserver
    command: ["worker"]
    volumes:
      - vultiserver-data:/data/vaults
      - ./vultiserver-config.json:/build/vultiserver/config.json:ro
    working_dir: /build/vultiserver
    depends_on:
      redis:
        condition: service_healthy
      relay:
        condition: service_healthy

volumes:
  vultiserver-data:
